<!doctype html>
<html lang="en" data-theme="pink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe0ef">
  <title>Yakimma — The world you can show off</title>
  <!-- Put the last-used theme on before the page draws, so it doesn't flash pink first. -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("yakimma.theme") || "pink"; } catch (e) {}</script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="homeBtn" aria-label="Yakimma home"><span class="logo">🐾</span> <span class="brand-name">Yakimma</span></a>
    <div class="top-actions"><button class="soft camera-btn" id="cameraBtn" aria-label="Take a picture" title="Take a picture">📷</button><span class="wallet" id="wallet">🐱 0 MC · 💌 0 LC</span><button class="soft" id="accountBtn">Sign in</button></div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Main navigation">
      <button class="nav active" data-page="feed">🏡 Feed</button>
      <button class="nav" data-page="profile">🌷 Profile</button>
      <button class="nav" data-page="pictures">🌇 Pictures</button>
      <button class="nav" data-page="settings">⚙️ Settings</button>
      <button class="nav" data-page="friends">👯 Friends</button>
      <button class="nav" data-page="groups">🏘️ Groups</button>
      <button class="nav" data-page="nails">💅 Nails</button>
      <button class="nav" data-page="shop">🛍️ Shop</button>
      <button class="nav" data-page="codes">👩‍💻 Codes</button>
      <button class="nav" data-page="about">🎀 About The Creator</button>
      <button class="nav" data-page="ads">🎉 Advertisement</button>
    </nav>
    <main id="main" aria-live="polite"></main>
  </div>
  <div id="modalroot"></div>
  <footer>Yakimma • The world you can show off • Early access starter</footer>
  <script src="/app.js" defer></script>
</body>
</html>
